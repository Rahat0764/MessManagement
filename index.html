<head>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Hind Siliguri"', 'sans-serif'] },
                    colors: {
                        darkBg: '#060b18',
                        darkCard: '#0f172a',

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Hind Siliguri', sans-serif; }

        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: linear-gradient(135deg, #eef6ff 0%, #f5f3ff 45%, #ecfeff 100%);
            transition: background 0.5s ease;
        }
        html.dark .ambient-bg {
            background: radial-gradient(circle at 15% 15%, #0c1938 0%, #060b18 55%, #090d1f 100%);
        }
        .orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(75px);
            opacity: 0.55;
            animation: floatOrb 16s infinite ease-in-out alternate;
        }
        html.dark .orb { opacity: 0.28; filter: blur(90px); }
        .orb-1 { width: 340px; height: 340px; background: #38bdf8; top: -80px; left: -80px; }
        .orb-2 { width: 380px; height: 380px; background: #818cf8; bottom: 5%; right: -100px; animation-delay: -5s; }
        .orb-3 { width: 280px; height: 280px; background: #34d399; top: 40%; left: 30%; animation-delay: -10s; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -35px) scale(1.1); }
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 24px -4px rgba(15, 23, 42, 0.06);
        }
        html.dark .glass-header {
            background: rgba(15, 23, 42, 0.68);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.45);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(20px) saturate(170%);
            -webkit-backdrop-filter: blur(20px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 32px -8px rgba(15, 23, 42, 0.07), inset 0 1px 0 0 rgba(255, 255, 255, 0.8);
        }
        html.dark .glass-card {
            background: rgba(15, 23, 42, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
        }

        .glass-modal {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.22);
        }
        html.dark .glass-modal {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #0f172a;
            transition: all 0.2s ease;
        }
        .glass-input::placeholder { color: #94a3b8; }
        .glass-input:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.18);
            background: rgba(255, 255, 255, 0.98);
        }
        html.dark .glass-input {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
        }
        html.dark .glass-input::placeholder { color: #64748b; }
        html.dark .glass-input:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.18);
            background: rgba(15, 23, 42, 0.92);
        }

        .floating-dock {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 16px 40px -6px rgba(15, 23, 42, 0.16), 0 4px 12px rgba(15, 23, 42, 0.06);
        }
        html.dark .floating-dock {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 20px 45px -8px rgba(0, 0, 0, 0.7), 0 0 25px -5px rgba(6, 182, 212, 0.15);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .fade-in { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .scale-in { animation: scaleIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .toast-enter { animation: toastIn 0.3s ease-out forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

        #ptr-loader { transition: height 0.3s, opacity 0.3s; height: 0; opacity: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #ptr-loader.active { height: 50px; opacity: 1; }
    </style>
</head>

        const env = (typeof import.meta !== 'undefined' && import.meta.env) ? import.meta.env : {};
        const CONFIG = {
            SUPABASE_URL: env.VITE_SUPABASE_URL || "",

            TG_CHAT_ID:   env.VITE_TG_CHAT_ID   || "",
            ADMIN_PIN:    String(env.VITE_ADMIN_PIN || "123456"),
            MONTHLY_FEE:  Number(env.VITE_MONTHLY_FEE || 6000)
        };

        const safeGetStorage = (k, fallback = null) => {
            try { return localStorage.getItem(k) ?? fallback; } catch (e) { return fallback; }
        };
        const safeSetStorage = (k, v) => {
            try { localStorage.setItem(k, v); } catch (e) {}
        };
        const safeRemoveStorage = (k) => {
            try { localStorage.removeItem(k); } catch (e) {}

        const days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];

                    timestamp: new Date().toLocaleString('bn-BD')

            ],
            cleaning: {

                    { id: '1730000000004-nadim', name: 'নাদিম', seq: 0 }
                ]
            }
        };

        let data = { routine: [], members: [], expenses: [], logs: [], cleaning: { id: '1', queue: [], current_seq: 0 } };
        let bazaarItems = [{ name: '', amount: '' }];
        let expState = { type: 'বাজার', shopper: '', note: '', total: '', date: new Date().toISOString().split('T')[0] };

        const applyTheme = () => {
            document.documentElement.classList.toggle('dark', isDark);
            const tText = document.getElementById('themeText');
            if (tText) tText.innerText = isDark ? 'হোয়াইট মোড' : 'ডার্ক মোড';
        };

        const isCurrentMonth = (dateStr) => {
            if (!dateStr) return false;
            const d = new Date(dateStr);
            const now = new Date();
            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        };

        const getOrdinal = (n) => {
            const ords = ['০', '১ম', '২য়', '৩য়', '৪র্থ', '৫ম', '৬ষ্ঠ', '৭ম', '৮ম', '৯ম', '১০ম'];
            if (n <= 10) return ords[n];
            return n.toString().replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) + 'তম';
        };

        const generateUniqueId = () => String(Date.now()) + '-' + Math.random().toString(36).substring(2, 7);
        const generateRefId = () => Math.random().toString(36).substring(2, 8).toUpperCase();

        const fmt = (n) => {
            n = Number(n);
            if (isNaN(n)) n = 0;
            return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
        };

        const idTime = (id) => parseInt(String(id).split('-')[0], 10) || 0;

        const getMemberFee = (m) => {
            return (m.custom_fee !== undefined && m.custom_fee !== null && m.custom_fee !== '')
                ? Number(m.custom_fee)
                : CONFIG.MONTHLY_FEE;
        };

        const parseLogMeta = (l) => {
            let logType = l.log_type || '';
            if (!logType) {
                if (l.action === 'টাকা জমা') logType = 'deposit';
                else if (l.action === 'হিসাব মাইনাস') logType = 'minus';
                else if (l.action === 'সদস্য ডিলিট' || l.action === 'সদস্য রিমুভ') logType = 'member_deleted';
            }

            let amt = (l.amount !== undefined && l.amount !== null && l.amount !== '') ? Number(l.amount) : null;
            if (amt === null || isNaN(amt)) {
                const m = String(l.details || '').match(/৳\s*([\d,]+\.?\d*)/);
                amt = m ? Number(m[1].replace(/,/g, '')) : 0;
            }

            let memberName = l.member || '';
            if (!memberName && l.details) {
                const nm = l.details.match(/^(.*?)(?:\s+নতুন করে|\s+এর জমা থেকে|-কে ডিলিট|\s+কে মেস থেকে)/);
                if (nm && nm[1]) memberName = nm[1].trim();
            }

            let note = l.note || '';
            if (!note && l.details && l.details.includes('• নোট:')) {
                note = l.details.split('• নোট:')[1].trim();
            }

            return { logType, amt, memberName, memberId: l.member_id || null, note };
        };
        const safeSupabaseInsert = async (table, row, fallbackRow = null) => {
            if (!supabase) return;
            try {
                const { error } = await supabase.from(table).insert([row]);
                if (error && fallbackRow) {
                    await supabase.from(table).insert([fallbackRow]);
                }
            } catch (e) {}
        };

        const safeSupabaseUpdate = async (table, row, id, fallbackRow = null) => {
            if (!supabase) return;
            try {
                const { error } = await supabase.from(table).update(row).eq('id', id);
                if (error && fallbackRow) {
                    await supabase.from(table).update(fallbackRow).eq('id', id);
                }
            } catch (e) {}
        };

        const showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'success'
                ? 'bg-emerald-600/95 border-emerald-400/40'
                : (type === 'error' ? 'bg-rose-600/95 border-rose-400/40' : 'bg-cyan-600/95 border-cyan-400/40');
            toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl backdrop-blur-xl text-white border ${colors}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-5 h-5 shrink-0"></i><span class="text-sm font-semibold">${msg}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = '0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        };

        const showCustomAlert = (title, message, isSuccess) => {
            const color = isSuccess ? 'emerald' : 'rose';
            const icon = isSuccess ? 'check-circle-2' : 'alert-circle';
            showModal(`
                <div class="text-center p-2">
                    <div class="w-16 h-16 bg-${color}-500/15 text-${color}-500 rounded-2xl flex items-center justify-center mx-auto mb-4 scale-in border border-${color}-500/25">
                        <i data-lucide="${icon}" class="w-8 h-8"></i>
                    </div>
                    <h3 class="font-bold text-xl mb-2 text-slate-800 dark:text-white">${title}</h3>
                    <p class="text-sm text-slate-600 dark:text-slate-300 mb-6">${message}</p>
                    <button id="closeModal" class="w-full py-3 bg-gradient-to-r from-cyan-600 to-indigo-600 text-white rounded-2xl font-bold transition-all active:scale-95 shadow-lg">ঠিক আছে</button>
                </div>
            `);
        };

        const sendTelegramMsg = async (msg, expId = null) => {
            if (!CONFIG.TG_TOKEN || !CONFIG.TG_CHAT_ID || (!CONFIG.TG_TOKEN.startsWith('bot') && !CONFIG.TG_TOKEN.includes(':'))) return;
            const chatIds = CONFIG.TG_CHAT_ID.split(',');
            const url = `https://api.telegram.org/bot${CONFIG.TG_TOKEN}/sendMessage`;
            const domain = window.location.origin + window.location.pathname;
            for (let id of chatIds) {
                let payload = { chat_id: id.trim(), text: msg, parse_mode: 'HTML' };
                if (expId) {
                    payload.reply_markup = {
                        inline_keyboard: [[
                            { text: "✅ Approve", url: `${domain}?action=approve_exp&id=${expId}&token=${CONFIG.ADMIN_PIN}` },
                            { text: "❌ Reject", url: `${domain}?action=reject_exp&id=${expId}&token=${CONFIG.ADMIN_PIN}` }
                        ]]
                    };
                }
                fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).catch(() => {});
            }
        };

        const logActivity = async (action, details, specificId = null, meta = null) => {
            const logId = specificId || generateRefId();
            const timestamp = new Date().toLocaleString('bn-BD');

            const newLog = {
                id: generateUniqueId(),
                log_id: logId,
                action,
                details,
                timestamp,
                amount: meta?.amount ?? null,
                member: meta?.member ?? null,
                member_id: meta?.member_id ?? null,
                note: meta?.note ?? '',
                log_type: meta?.log_type ?? null
            };
            const fallbackLog = {
                id: newLog.id,
                log_id: logId,
                action,
                details,
                timestamp,
                amount: meta?.amount ?? null,
                member: meta?.member ?? null
            };

            data.logs.unshift(newLog);
            await safeSupabaseInsert('activity_logs', newLog, fallbackLog);
            await sendTelegramMsg(`🔔 <b>${action}</b>\n📝 ${details}\n⏰ সময়: ${timestamp}\n🔑 Ref ID: #${logId}`);
            return logId;
        };

        const handleUrlActions = async () => {
            const params = new URLSearchParams(window.location.search);
            const action = params.get('action');
            const id = params.get('id');
            const token = params.get('token');
            if (action && id && token) {
                window.history.replaceState({}, document.title, window.location.pathname);
                setTimeout(async () => {
                    if (token === CONFIG.ADMIN_PIN) {
                        if (action === 'approve_exp') {
                            if (supabase) await supabase.from('expenses').update({ status: 'approved' }).eq('id', id);
                            await logActivity('Expense Approved', `Ref #${id} অনুমোদিত হয়েছে।`, id);
                            showCustomAlert('অ্যাপ্রুভড!', 'খরচটি সফলভাবে ডাটাবেজে অ্যাপ্রুভ করা হয়েছে।', true);
                        } else if (action === 'reject_exp') {
                            if (supabase) await supabase.from('expenses').delete().eq('id', id);
                            await logActivity('Expense Rejected', `Ref #${id} বাতিল করা হয়েছে।`, id);
                            showCustomAlert('বাতিলকৃত!', 'খরচটি ডাটাবেজ থেকে মুছে ফেলা হয়েছে।', false);
                        }
                    } else {
                        showCustomAlert('ভুল পিন!', 'এডমিন পিন সঠিক নয়। অনুমোদন দেওয়া সম্ভব হয়নি।', false);
                    }
                }, 500);
            }
        };

        const updateAdminHeaderUI = () => {
            const btnText = document.getElementById('adminBtnText');
            const btn = document.getElementById('adminBtn');
            if (!btnText || !btn) return;
            if (isAdmin) {
                btnText.innerText = 'লগআউট (এডমিন)';
                btn.className = 'flex items-center gap-1.5 text-xs sm:text-sm font-bold text-emerald-700 dark:text-emerald-300 bg-emerald-500/15 dark:bg-emerald-400/15 hover:bg-emerald-500/25 px-3.5 py-2 rounded-2xl border border-emerald-500/30 transition-all active:scale-95 shadow-sm';
            } else {
                btnText.innerText = 'এডমিন লগইন';
                btn.className = 'flex items-center gap-1.5 text-xs sm:text-sm font-bold text-cyan-700 dark:text-cyan-300 bg-cyan-500/10 dark:bg-cyan-400/10 hover:bg-cyan-500/20 px-3.5 py-2 rounded-2xl border border-cyan-500/25 transition-all active:scale-95 shadow-sm';
            }
        };

        const initApp = async () => {
            applyTheme();
            updateAdminHeaderUI();

            let loadedFromDb = false;
            if (supabase) {
                try {
                    const [resR, resM, resE, resL, resC] = await Promise.all([
                        supabase.from('routine').select('*').order('id'),
                        supabase.from('members').select('*').order('id'),
                        supabase.from('expenses').select('*').order('date', { ascending: false }),
                        supabase.from('activity_logs').select('*').order('id', { ascending: false }),
                        supabase.from('cleaning_tasks').select('*').eq('id', '1')
                    ]);
                    if (resR.data && resR.data.length > 0) { data.routine = resR.data; loadedFromDb = true; }
                    if (resM.data && resM.data.length > 0) { data.members = resM.data; loadedFromDb = true; }
                    if (resE.data) data.expenses = resE.data;
                    if (resL.data) data.logs = resL.data;
                    if (resC.data && resC.data.length > 0) {
                        data.cleaning = resC.data[0];
                    } else if (data.members.length > 0) {
                        data.cleaning.queue = data.members.map(m => ({ id: m.id, name: m.name, seq: 0 }));
                        await supabase.from('cleaning_tasks').insert([data.cleaning]);
                    }

                    if (data.members.length > 0 && data.cleaning.queue.length > 0) {
                        const qIds = data.cleaning.queue.map(q => String(q.id));
                        const missing = data.members.filter(m => !qIds.includes(String(m.id)));
                        if (missing.length > 0) {
                            missing.forEach(m => data.cleaning.queue.push({ id: m.id, name: m.name, seq: 0 }));
                            await supabase.from('cleaning_tasks').update({ queue: data.cleaning.queue }).eq('id', '1');
                        }
                    }
                } catch (err) {}
            }

            if (!loadedFromDb && data.members.length === 0) {
                data = JSON.parse(JSON.stringify(FALLBACK_DATA));
            }

            await handleUrlActions();
            render();
        };

        const updateNavUI = () => {
            document.querySelectorAll('.nav-btn').forEach(b => {
                if (b.dataset.tab === activeTab) {
                    b.className = 'nav-btn flex flex-col items-center justify-center gap-0.5 flex-1 py-2 px-3 rounded-full transition-all duration-300 bg-gradient-to-r from-cyan-500 via-teal-500 to-indigo-600 text-white shadow-lg shadow-cyan-500/30 scale-105';
                } else {
                    b.className = 'nav-btn flex flex-col items-center justify-center gap-0.5 flex-1 py-2 px-2 rounded-full transition-all duration-300 text-slate-600 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-300 hover:bg-white/40 dark:hover:bg-white/5';
                }
            });
        };

        const render = () => {
            const content = document.getElementById('app-content');
            if (activeTab === 'routine') content.innerHTML = buildRoutineHTML();
            else if (activeTab === 'finance') content.innerHTML = buildFinanceHTML();
            else if (activeTab === 'tasks') content.innerHTML = buildTasksHTML();
            else if (activeTab === 'expense') content.innerHTML = buildExpenseHTML();
            else if (activeTab === 'overview') content.innerHTML = buildOverviewHTML();
            lucide.createIcons();
            attachDynamicListeners();
            updateNavUI();
            updateAdminHeaderUI();
        };

            const todayRoutine = data.routine.find(r => r.day === today) || data.routine[0];
            const currentDayNumber = new Date().getDate();
            const dateStr = new Date().toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
            let html = '';

            if (currentDayNumber > 10) {
                const isRentPaid = data.expenses.some(e => e.type === 'বাসা ভাড়া' && e.status === 'approved' && isCurrentMonth(e.date));
                const isWifiPaid = data.expenses.some(e => e.type === 'ওয়াইফাই বিল' && e.status === 'approved' && isCurrentMonth(e.date));
                if (!isRentPaid || !isWifiPaid) {
                    html += `<div class="space-y-3 mb-6">`;
                    if (!isRentPaid) html += `<div class="flex items-center gap-3 glass-card border-rose-300 dark:border-rose-500/30 bg-rose-500/10 text-rose-700 dark:text-rose-300 p-4 rounded-2xl"><i data-lucide="alert-triangle" class="w-6 h-6 shrink-0 text-rose-500"></i><span class="text-sm">আজ মাসের <b>${currentDayNumber} তারিখ</b>, এখনো <b>বাসা ভাড়া</b> এন্ট্রি দেওয়া হয়নি!</span></div>`;
                    if (!isWifiPaid) html += `<div class="flex items-center gap-3 glass-card border-amber-300 dark:border-amber-500/30 bg-amber-500/10 text-amber-800 dark:text-amber-300 p-4 rounded-2xl"><i data-lucide="wifi-off" class="w-6 h-6 shrink-0 text-amber-500"></i><span class="text-sm">১০ দিন পার হয়ে গেছে! এখনও <b>ওয়াইফাই বিল</b> পরিশোধ করা হয়নি।</span></div>`;
                    html += `</div>`;
                }
            }

            html += `<div class="flex justify-between items-end mb-4"><div><p class="text-xs font-bold uppercase tracking-wider text-cyan-600 dark:text-cyan-400 mb-1">${dateStr}</p><h2 class="text-2xl font-extrabold text-slate-800 dark:text-white">আজকের খাবার মেনু</h2></div></div>`;

            if (todayRoutine) {
                html += `
                <div class="bg-gradient-to-br from-cyan-600 via-teal-600 to-indigo-700 rounded-3xl p-6 mb-6 shadow-xl shadow-cyan-500/20 text-white relative overflow-hidden border border-white/25">
                    <i data-lucide="utensils-crossed" class="absolute -right-6 -top-6 w-36 h-36 text-white/10 transform rotate-12"></i>
                    <div class="flex justify-between items-center mb-5 relative z-10">
                        <span class="bg-white/20 backdrop-blur-md text-white px-4 py-1.5 rounded-full text-sm font-bold border border-white/25 flex items-center gap-2"><i data-lucide="Sparkles" class="w-4 h-4"></i> ${todayRoutine.day}</span>
                        ${isAdmin ? `<button class="edit-routine-btn p-2.5 bg-white/15 hover:bg-white/25 rounded-xl transition-colors border border-white/20" data-id="${todayRoutine.id}"><i data-lucide="edit-3" class="w-4 h-4"></i></button>` : ''}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 relative z-10">
                        <div class="bg-white/15 backdrop-blur-md border border-white/25 p-4 rounded-2xl">
                            <div class="flex items-center gap-2 text-cyan-100 mb-1.5 font-semibold text-xs"><i data-lucide="sunrise" class="w-4 h-4"></i> সকালের নাস্তা</div>
                            <div class="text-lg font-bold">${todayRoutine.b || 'নির্ধারিত নেই'}</div>
                        </div>
                        <div class="bg-white/15 backdrop-blur-md border border-white/25 p-4 rounded-2xl">
                            <div class="flex items-center gap-2 text-cyan-100 mb-1.5 font-semibold text-xs"><i data-lucide="sun" class="w-4 h-4"></i> দুপুরের খাবার</div>
                            <div class="text-lg font-bold">${todayRoutine.l || 'নির্ধারিত নেই'}</div>
                        </div>
                        <div class="bg-white/15 backdrop-blur-md border border-white/25 p-4 rounded-2xl">
                            <div class="flex items-center gap-2 text-cyan-100 mb-1.5 font-semibold text-xs"><i data-lucide="moon" class="w-4 h-4"></i> রাতের খাবার</div>
                            <div class="text-lg font-bold">${todayRoutine.d || 'নির্ধারিত নেই'}</div>
                        </div>
                    </div>
                </div>`;
            }

            html += `
            <div class="glass-card rounded-3xl overflow-hidden">
                <div class="p-5 border-b border-slate-200/70 dark:border-white/10 flex justify-between items-center">
                    <h3 class="font-bold text-lg flex items-center gap-2 text-slate-800 dark:text-white"><i data-lucide="calendar-days" class="w-5 h-5 text-cyan-500"></i> সাপ্তাহিক বিস্তারিত রুটিন</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead>
                            <tr class="text-slate-500 dark:text-slate-400 border-b border-slate-200/60 dark:border-white/10 text-xs uppercase tracking-wider bg-white/40 dark:bg-slate-900/40">
                                <th class="p-4 font-bold">বার</th>
                                <th class="p-4 font-bold">সকাল</th>
                                <th class="p-4 font-bold">দুপুর</th>
                                <th class="p-4 font-bold">রাত</th>
                                ${isAdmin ? '<th class="p-4 text-right font-bold">এডিট</th>' : ''}
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200/50 dark:divide-white/5">
                            ${data.routine.length ? data.routine.map(r => `
                                <tr class="text-sm transition-colors hover:bg-white/50 dark:hover:bg-white/5 ${r.day === today ? 'bg-cyan-500/10 dark:bg-cyan-400/10' : ''}">
                                    <td class="p-4 font-bold text-cyan-700 dark:text-cyan-400">${r.day}</td>
                                    <td class="p-4 text-slate-700 dark:text-slate-200">${r.b || '-'}</td>
                                    <td class="p-4 text-slate-700 dark:text-slate-200">${r.l || '-'}</td>
                                    <td class="p-4 text-slate-700 dark:text-slate-200">${r.d || '-'}</td>
                                    ${isAdmin ? `<td class="p-4 text-right"><button class="text-slate-600 dark:text-slate-300 hover:text-cyan-600 dark:hover:text-cyan-400 edit-routine-btn p-2 glass-card rounded-xl transition-colors" data-id="${r.id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button></td>` : ''}
                                </tr>
                            `).join('') : `<tr><td colspan="5" class="p-8 text-center text-slate-500">ডাটাবেজে রুটিন নেই।</td></tr>`}
                        </tbody>
                    </table>
                </div>
            </div>`;
            return html;
        };

        const buildFinanceHTML = () => {
            const totalExpected = data.members.reduce((s, m) => s + getMemberFee(m), 0);
            const totalPaid = data.members.reduce((s, m) => s + Number(m.paid || 0), 0);
            const diff = totalPaid - totalExpected;

            let html = `
            <div class="flex flex-wrap justify-between items-center gap-3 mb-5">
                <div>
                    <h3 class="font-extrabold text-2xl text-slate-800 dark:text-white">সদস্যদের হিসাব</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">মোট সদস্য: ${data.members.length} জন • ডিফল্ট মাসিক ফি: ৳${fmt(CONFIG.MONTHLY_FEE)}</p>
                </div>
                <div class="flex gap-2">
                    ${isAdmin ? `<button id="addMemberBtn" class="bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white px-4 py-2.5 rounded-2xl text-xs font-bold shadow-lg shadow-cyan-500/25 transition-all active:scale-95 flex items-center gap-1.5"><i data-lucide="user-plus" class="w-4 h-4"></i> নতুন সদস্য যোগ</button>` : ''}
                </div>
            </div>

            <!-- কুইক সামারি বার -->
            <div class="glass-card rounded-2xl p-4 mb-5 grid grid-cols-3 gap-2 text-center">
                <div class="p-2 rounded-xl bg-slate-500/5 dark:bg-white/5">
                    <span class="text-[11px] font-bold text-slate-500 dark:text-slate-400 block">জমা হওয়ার কথা</span>
                    <span class="text-base sm:text-lg font-extrabold text-slate-800 dark:text-white">৳${fmt(totalExpected)}</span>
                </div>
                <div class="p-2 rounded-xl bg-emerald-500/10">
                    <span class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 block">জমা হয়েছে</span>
                    <span class="text-base sm:text-lg font-extrabold text-emerald-600 dark:text-emerald-400">৳${fmt(totalPaid)}</span>
                </div>
                <div class="p-2 rounded-xl ${diff < 0 ? 'bg-rose-500/10' : (diff > 0 ? 'bg-cyan-500/10' : 'bg-slate-500/10')}">
                    <span class="text-[11px] font-bold ${diff < 0 ? 'text-rose-600 dark:text-rose-400' : (diff > 0 ? 'text-cyan-600 dark:text-cyan-400' : 'text-slate-500')} block">${diff < 0 ? 'কম আছে (বাকি)' : (diff > 0 ? 'বেশি জমা আছে' : 'বকেয়া নেই')}</span>
                    <span class="text-base sm:text-lg font-extrabold ${diff < 0 ? 'text-rose-600 dark:text-rose-400' : (diff > 0 ? 'text-cyan-600 dark:text-cyan-400' : 'text-slate-700 dark:text-slate-300')}">৳${fmt(Math.abs(diff))}</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;

            if (data.members.length === 0) {
                html += `<div class="col-span-full p-8 text-center text-slate-500 glass-card rounded-3xl">কোনো সদস্য নেই। নতুন সদস্য যোগ করুন।</div>`;
            }

            html += data.members.map(m => {
                const baseFee = getMemberFee(m);
                const paid = Number(m.paid || 0);
                const netBalance = paid - baseFee;

                const lastMemberLog = data.logs.find(l => (l.member_id && String(l.member_id) === String(m.id)) || l.member === m.name);
                const lastNote = lastMemberLog ? parseLogMeta(lastMemberLog).note : '';

                let badgeColor, badgeText, badgeIcon, textColor;
                if (netBalance > 0) {
                    badgeColor = 'bg-emerald-500/10 border-emerald-500/25';
                    textColor = 'text-emerald-700 dark:text-emerald-300';
                    badgeText = 'অতিরিক্ত জমা (বাসা থেকে পাবে)';
                    badgeIcon = 'trending-up';
                } else if (netBalance < 0) {
                    badgeColor = 'bg-rose-500/10 border-rose-500/25';
                    textColor = 'text-rose-700 dark:text-rose-300';
                    badgeText = 'বাসায় বাকি (কম জমা)';
                    badgeIcon = 'alert-circle';

                            <span class="text-2xl font-extrabold block text-rose-600 dark:text-rose-400 tracking-tight">-৳${fmt(meta.amt)}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-700 dark:text-rose-300">ব্যালেন্স মাইনাস</span>
                        </div>`;
                } else if (meta.amt > 0 && isEditableDeposit) {
                    amountHtml = `
                        <div class="text-right shrink-0">
                            <span class="text-lg font-extrabold block ${isMinus ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-600 dark:text-emerald-400'}">${isMinus ? '-' : '+'}৳${fmt(meta.amt)}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isMinus ? 'bg-rose-500/15 text-rose-700 dark:text-rose-300' : 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300'}">${isMinus ? 'মাইনাস' : 'জমা'}</span>
                        </div>`;
                }

                let iconType = 'piggy-bank';
                let iconColor = 'text-cyan-600 dark:text-cyan-400 bg-cyan-500/15';
                if (isMinus) { iconType = 'trending-down'; iconColor = 'text-rose-600 dark:text-rose-400 bg-rose-500/15'; }
                if (isMemberDeleted) { iconType = 'user-x'; iconColor = 'text-rose-600 dark:text-rose-400 bg-rose-500/20'; }
                if (l.action.includes('পরিষ্কার')) { iconType = 'sparkles'; iconColor = 'text-amber-600 dark:text-amber-400 bg-amber-500/15'; }

                return `
                <div class="log-item p-4 border-b border-slate-200/60 dark:border-white/10 relative transition-colors ${isMemberDeleted ? 'bg-rose-500/10 dark:bg-rose-500/15 border-l-4 border-l-rose-500' : 'hover:bg-white/40 dark:hover:bg-white/5'}" data-search="${l.action.toLowerCase()} ${l.details.toLowerCase()} ${(meta.note || '').toLowerCase()} ${l.log_id?.toLowerCase() || ''}">
                    <div class="flex justify-between items-start gap-2 ${isAdmin ? 'pr-16' : ''}">
                        <div class="flex gap-3 min-w-0">
                            <div class="p-2.5 rounded-2xl h-fit shrink-0 ${iconColor}"><i data-lucide="${iconType}" class="w-5 h-5"></i></div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="font-extrabold text-sm ${isMemberDeleted ? 'text-rose-600 dark:text-rose-400' : 'text-slate-800 dark:text-white'}">${l.action}</span>
                                    <span class="text-[10px] text-slate-500 dark:text-slate-400 bg-slate-500/10 dark:bg-white/10 px-1.5 py-0.5 rounded-md font-mono">#${l.log_id || String(l.id).substring(String(l.id).length - 5)}</span>
                                </div>
                                ${isMemberDeleted ? `
                                    <p class="text-sm font-extrabold text-rose-600 dark:text-rose-400 mt-1 leading-relaxed">${meta.memberName || 'সদস্য'}-কে ডিলিট করা হয়েছে এবং তার জমাকৃত <span class="text-base underline">৳${fmt(meta.amt)}</span> মাইনাস করা হয়েছে।</p>
                                ` : `
                                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-1 leading-relaxed">${l.details}</p>
                                `}
                                ${meta.note ? `<div class="mt-1.5 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-cyan-500/10 border border-cyan-500/25 text-cyan-800 dark:text-cyan-300 text-xs font-medium"><i data-lucide="sticky-note" class="w-3.5 h-3.5 shrink-0"></i> <span>নোট: ${meta.note}</span></div>` : ''}
                                <p class="text-[10px] text-slate-400 dark:text-slate-500 mt-2 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${l.timestamp}</p>
                            </div>
                        </div>
                        ${amountHtml}
                    </div>
                    ${isAdmin ? `
                        <div class="absolute top-4 right-3 flex items-center gap-1">
                            ${isEditableDeposit ? `<button title="জমার হিস্ট্রি এডিট করুন" class="edit-log-btn text-cyan-600 dark:text-cyan-400 hover:bg-cyan-500/15 p-1.5 rounded-xl transition-colors" data-id="${l.id}"><i data-lucide="edit-2" class="w-4 h-4 pointer-events-none"></i></button>` : ''}
                            <button title="হিস্ট্রি ডিলিট করুন (টাকাও সমন্বয় হবে)" class="delete-log-btn text-rose-500 hover:bg-rose-500/15 p-1.5 rounded-xl transition-colors" data-id="${l.id}"><i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i></button>
                        </div>
                    ` : ''}
                </div>`;
            }).join('') || '<div class="p-8 text-center text-slate-500 text-sm">কোনো জমার হিস্ট্রি নেই</div>';

            const gridCols = isAdmin ? 'md:grid-cols-3' : 'md:grid-cols-2';

            return `
            <!-- Export & Backup Actions -->
            <div class="grid grid-cols-2 ${gridCols} gap-3 mb-6">
                <button id="exportPdfBtn" class="flex items-center justify-center gap-2.5 bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white p-3.5 rounded-2xl shadow-lg shadow-cyan-500/20 transition-all active:scale-95">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <span class="text-xs font-extrabold uppercase tracking-wider">PDF স্টেটমেন্ট ডাউনলোড</span>
                </button>
                <button id="backupJsonBtn" class="flex items-center justify-center gap-2.5 glass-card hover:bg-white/80 dark:hover:bg-slate-800/80 text-slate-800 dark:text-white p-3.5 rounded-2xl transition-all active:scale-95">
                    <i data-lucide="download-cloud" class="w-5 h-5 text-cyan-500"></i>
                    <span class="text-xs font-extrabold uppercase tracking-wider">ডেটা ব্যাকআপ (JSON)</span>
                </button>
                ${isAdmin ? `
                <label class="col-span-2 md:col-span-1 flex items-center justify-center gap-2.5 bg-rose-500/15 hover:bg-rose-500/25 text-rose-700 dark:text-rose-300 border border-rose-500/30 p-3.5 rounded-2xl transition-all active:scale-95 cursor-pointer">
                    <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                    <span class="text-xs font-extrabold uppercase tracking-wider">রিস্টোর (JSON)</span>
                    <input type="file" id="importJsonFile" accept=".json" class="hidden">
                </label>
                ` : ''}
            </div>

            <!-- ৪টি মূল সামারি কার্ড (নতুন 'ফি আদায় ও বকেয়া স্থিতি' কার্ডসহ) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <!-- Card 1: মোট ফান্ড কালেকশন -->
                <div class="bg-gradient-to-br from-cyan-600 to-blue-700 p-5 rounded-3xl shadow-xl shadow-cyan-500/20 text-white relative overflow-hidden border border-white/20">
                    <i data-lucide="wallet" class="absolute -right-4 -bottom-4 w-24 h-24 text-white/10 transform rotate-12"></i>
                    <span class="text-[11px] font-bold block uppercase tracking-wider text-cyan-100 mb-1">মোট ফান্ড কালেকশন</span>
                    <h3 class="text-3xl font-extrabold relative z-10">৳${fmt(totalFund)}</h3>
                    <p class="text-[11px] text-cyan-100/80 mt-2">সদস্যদের মোট জমাকৃত অর্থ</p>
                </div>

                <!-- Card 2: মোট বাজার ও খরচ -->
                <div class="bg-gradient-to-br from-rose-500 to-orange-600 p-5 rounded-3xl shadow-xl shadow-rose-500/20 text-white relative overflow-hidden border border-white/20">
                    <i data-lucide="shopping-cart" class="absolute -right-4 -bottom-4 w-24 h-24 text-white/10 transform rotate-12"></i>
                    <span class="text-[11px] font-bold block uppercase tracking-wider text-rose-100 mb-1">মোট বাজার ও খরচ</span>
                    <h3 class="text-3xl font-extrabold relative z-10">৳${fmt(totalSpent)}</h3>
                    <p class="text-[11px] text-rose-100/80 mt-2">অনুমোদিত সকল বিল ও বাজার</p>
                </div>

                <!-- Card 3: বর্তমান ব্যালেন্স -->
                <div class="bg-gradient-to-br from-emerald-500 to-teal-600 p-5 rounded-3xl shadow-xl shadow-emerald-500/20 text-white relative overflow-hidden border border-white/20">
                    <i data-lucide="landmark" class="absolute -right-4 -bottom-4 w-24 h-24 text-white/10 transform rotate-12"></i>
                    <span class="text-[11px] font-bold block uppercase tracking-wider text-emerald-100 mb-1">বর্তমান ব্যালেন্স</span>
                    <h3 class="text-3xl font-extrabold relative z-10">৳${fmt(remaining)}</h3>
                    <p class="text-[11px] text-emerald-100/80 mt-2">খরচ বাদে বাসায় অবশিষ্ট টাকা</p>
                </div>

                <!-- Card 4: ফি আদায় ও বকেয়া স্থিতি (নতুন কার্ড) -->
                <div class="bg-gradient-to-br ${feeCardGradient} p-5 rounded-3xl shadow-xl text-white relative overflow-hidden border border-white/20">
                    <i data-lucide="scale" class="absolute -right-4 -bottom-4 w-24 h-24 text-white/10 transform rotate-12"></i>
                    <span class="text-[11px] font-bold block uppercase tracking-wider text-white/90 mb-2">ফি আদায় ও বকেয়া স্থিতি</span>
                    <div class="space-y-1 text-xs relative z-10 bg-black/15 backdrop-blur-sm p-2.5 rounded-2xl border border-white/15">
                        <div class="flex justify-between"><span>জমা হওয়ার কথা:</span> <b class="font-extrabold">৳${fmt(totalExpectedFee)}</b></div>
                        <div class="flex justify-between"><span>জমা হয়েছে:</span> <b class="font-extrabold">৳${fmt(totalFund)}</b></div>
                        <div class="flex justify-between pt-1 border-t border-white/20 text-sm">
                            <span class="font-bold">${feeStatusLabel}:</span>
                            <b class="font-extrabold underline">${feeStatusValue}</b>
                        </div>
                    </div>
                </div>
            </div>

            <!-- দুই কলামের হিস্ট্রি (খরচের হিস্টোরি ও জমার হিস্ট্রি) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                <div class="glass-card rounded-3xl overflow-hidden flex flex-col h-[540px]">
                    <div class="p-4 border-b border-slate-200/70 dark:border-white/10 bg-white/40 dark:bg-slate-900/40 flex justify-between items-center gap-2">
                        <h3 class="font-extrabold text-base flex items-center gap-2 shrink-0 text-slate-800 dark:text-white">
                            <i data-lucide="shopping-bag" class="w-4 h-4 text-orange-500"></i> খরচের হিস্টোরি
                        </h3>
                        <div class="relative w-full max-w-[170px]">
                            <i data-lucide="search" class="absolute left-3 top-2.5 w-3.5 h-3.5 text-slate-400"></i>
                            <input type="text" id="expSearch" placeholder="খাত, নাম বা নোট..." class="glass-input w-full pl-8 pr-2.5 py-1.5 text-xs rounded-xl outline-none">
                        </div>
                    </div>
                    <div class="overflow-y-auto hide-scrollbar flex-1" id="expenseLogContainer">${expenseList}</div>
                </div>

                <div class="glass-card rounded-3xl overflow-hidden flex flex-col h-[540px]">
                    <div class="p-4 border-b border-slate-200/70 dark:border-white/10 bg-white/40 dark:bg-slate-900/40 flex justify-between items-center gap-2">
                        <h3 class="font-extrabold text-base flex items-center gap-2 shrink-0 text-slate-800 dark:text-white">
                            <i data-lucide="history" class="w-4 h-4 text-emerald-500"></i> জমার ও অ্যাক্টিভিটি হিস্ট্রি
                        </h3>
                        <div class="relative w-full max-w-[170px]">
                            <i data-lucide="search" class="absolute left-3 top-2.5 w-3.5 h-3.5 text-slate-400"></i>
                            <input type="text" id="logSearch" placeholder="নাম, নোট বা ID..." class="glass-input w-full pl-8 pr-2.5 py-1.5 text-xs rounded-xl outline-none">
                        </div>
                    </div>
                    <div class="overflow-y-auto hide-scrollbar flex-1" id="depositLogContainer">${depositHtml}</div>
                </div>
            </div>

            ${isAdmin ? `
                <button id="resetAllBtn" class="w-full mt-3 py-4 bg-rose-500/15 text-rose-600 dark:text-rose-400 font-extrabold rounded-2xl border border-rose-500/30 hover:bg-rose-500/25 transition-colors flex items-center justify-center gap-2 active:scale-95">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i> সম্পূর্ণ হিসাব রিসেট করুন (নতুন মাস শুরু)
                </button>
            ` : ''}`;
        };

        const generatePDFStatement = () => {
            const totalExpectedFee = data.members.reduce((sum, m) => sum + getMemberFee(m), 0);
            const totalFund = data.members.reduce((sum, m) => sum + Number(m.paid || 0), 0);
            const approvedExpenses = data.expenses.filter(e => e.status === 'approved');
            const totalSpent = approvedExpenses.reduce((sum, e) => sum + Number(e.total || 0), 0);
            const remaining = totalFund - totalSpent;
            const feeDiff = totalFund - totalExpectedFee;

            const bnDate = (d) => d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
            const genDate = bnDate(new Date());

            let allTimes = [];
            data.expenses.forEach(e => { if (e.date) { const d = new Date(e.date); if (!isNaN(d)) allTimes.push(d.getTime()); } });
            data.logs.forEach(l => { const t = idTime(l.id); if (t) allTimes.push(t); });
            const firstDate = allTimes.length ? new Date(Math.min(...allTimes)) : new Date();
            const rangeStr = `${bnDate(firstDate)} থেকে ${genDate} পর্যন্ত হিসাব`;

            const ledgerEntries = data.logs
                .filter(l => l.action === 'টাকা জমা' || l.action === 'হিসাব মাইনাস' || l.action === 'সদস্য ডিলিট')
                .map(l => {
                    const meta = parseLogMeta(l);
                    const isMinus = meta.logType === 'minus' || meta.logType === 'member_deleted' || l.action !== 'টাকা জমা';
                    return {
                        time: idTime(l.id) || Date.now(),
                        name: meta.memberName || '—',
                        amt: meta.amt,
                        note: meta.note,
                        isMinus,
                        isDeletedMember: meta.logType === 'member_deleted' || l.action === 'সদস্য ডিলিট'
                    };
                })
                .sort((a, b) => b.time - a.time);

            const ledgerHtml = ledgerEntries.length ? ledgerEntries.map(e => `
                <div style="break-inside: avoid; background: ${e.isMinus ? 'rgba(220,38,38,0.06)' : 'rgba(22,163,74,0.06)'}; border: 1px solid ${e.isMinus ? 'rgba(220,38,38,0.25)' : 'rgba(22,163,74,0.25)'}; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold; font-size:12.5px; color:${e.isDeletedMember ? '#dc2626' : '#0f172a'};">${e.name} ${e.isDeletedMember ? '(সদস্য ডিলিট)' : ''}</span>
                        <span style="font-weight:bold; font-size:${e.isDeletedMember ? '15px' : '13.5px'}; color:${e.isMinus ? '#dc2626' : '#16a34a'};">${e.isMinus ? '-' : '+'}৳${fmt(e.amt)}</span>
                    </div>
                    ${e.note ? `<div style="font-size:11px; color:#0f766e; margin-top:3px;">নোট: ${e.note}</div>` : ''}
                    <div style="font-size:10px; color:#64748b; margin-top:3px;">${bnDate(new Date(e.time))} • ${e.isDeletedMember ? 'ডিলিটকৃত সদস্যের জমা মাইনাস' : (e.isMinus ? 'জমা থেকে মাইনাস' : 'নতুন জমা')}</div>
                </div>`).join('') : '<div style="color:#94a3b8; text-align:center; padding: 20px;">কোনো জমার হিস্ট্রি নেই</div>';

            const typeEmoji = (t) => t === 'বাজার' ? '🛒' : (t === 'ওয়াইফাই বিল' ? '📶' : (t === 'বাসা ভাড়া' ? '🏠' : (t === 'কারেন্ট বিল' ? '⚡' : (t === 'খালার বিল' ? '👩‍🍳' : '🧾'))));
            const expenseCardsHtml = approvedExpenses.length ? approvedExpenses.map(e => `
                <div style="break-inside: avoid; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold; font-size:13px;">${typeEmoji(e.type)} ${e.type}${e.shopper ? ` <span style="color:#64748b; font-weight:normal; font-size:11px;">(${e.shopper})</span>` : ''}</span>
                        <span style="font-weight:bold; font-size:14px; color:#c2410c;">৳${fmt(e.total)}</span>
                    </div>
                    <div style="font-size:10.5px; color:#64748b; margin-top:2px;">${e.date}${e.note ? ` • <b>নোট: ${e.note}</b>` : ''}</div>
                    ${e.items && e.items.length ? `<div style="margin-top:8px; background:white; border-radius:8px; padding:8px 10px;">
                        ${e.items.map(i => `<div style="display:flex; justify-content:space-between; font-size:11px; padding:3px 0; border-bottom:1px dashed #f1f5f9;"><span>${i.name}</span><b>৳${fmt(i.amount)}</b></div>`).join('')}
                    </div>` : ''}
                </div>`).join('') : '<div style="color:#94a3b8; text-align:center; padding: 20px;">কোনো খরচের রেকর্ড নেই</div>';

            let membersHtml = data.members.map((m, idx) => {
                let expected = getMemberFee(m);
                let paid = Number(m.paid || 0);
                let netBalance = paid - expected;

                let statColor = netBalance > 0 ? '#16a34a' : (netBalance < 0 ? '#dc2626' : '#475569');
                let statText = netBalance > 0 ? `+৳${fmt(netBalance)} (বেশি দিয়েছে)` : (netBalance < 0 ? `-৳${fmt(Math.abs(netBalance))} (কম আছে)` : `ক্লিয়ার`);
                let rowBg = idx % 2 === 0 ? '#ffffff' : '#f8fafc';

                return `
                <tr style="background-color: ${rowBg};">
                    <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; font-weight: 600;">${m.name}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">৳${fmt(expected)}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; font-weight: bold;">৳${fmt(paid)}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; font-weight: bold; color: ${statColor};">${statText}</td>
                </tr>`;
            }).join('');

            const feeDiffTitle = feeDiff < 0 ? 'কম উঠানো হয়েছে (উঠানো বাকি)' : (feeDiff > 0 ? 'বেশি উঠানো হয়েছে (অতিরিক্ত জমা)' : 'বকেয়া স্থিতি');
            const feeDiffColor = feeDiff < 0 ? '#dc2626' : (feeDiff > 0 ? '#0d9488' : '#475569');
            const feeDiffText = feeDiff === 0 ? '৳0 (সমান)' : `${feeDiff > 0 ? '+' : '-'}৳${fmt(Math.abs(feeDiff))}`;

            const html = `
            <div style="font-family: 'Hind Siliguri', sans-serif; padding: 0; color: #1e293b; background: white;">
                <!-- PAGE 1: Header + Deposit History -->
                <div style="background: linear-gradient(135deg, #0891b2, #4f46e5); padding: 26px 30px; color: white;">
                    <h1 style="margin: 0; font-size: 24px; font-weight: 700;">🏠 মাসিক মেস হিসাব স্টেটমেন্ট</h1>
                    <p style="opacity: 0.92; margin-top: 5px; font-size: 12.5px;">${rangeStr} • Made By Rahat</p>
                </div>
                <div style="padding: 22px 28px;">
                    <h3 style="color: #166534; margin: 0 0 14px 0; font-size: 16px;">💰 মোট জমা ও ফান্ড হিস্ট্রি</h3>
                    <div style="column-count: 2; column-gap: 18px;">
                        ${ledgerHtml}
                    </div>
                    <div style="margin-top: 10px; background: linear-gradient(135deg, #ecfdf5, #f0fdf4); border: 1px solid #bbf7d0; padding: 16px; border-radius: 12px; text-align: center;">
                        <span style="font-size: 11px; color: #166534; font-weight: 700;">সর্বমোট ফান্ড কালেকশন</span>
                        <h2 style="margin: 4px 0 0 0; font-size: 24px; color: #166534;">৳${fmt(totalFund)}</h2>
                    </div>
                </div>

                <!-- PAGE 2: Itemized Expense History -->
                <div style="page-break-before: always; padding: 26px 28px 22px 28px;">
                    <h3 style="color: #9a3412; margin: 0 0 14px 0; font-size: 16px;">🧾 মোট খরচ ও বাজারের বিস্তারিত তালিকা</h3>
                    ${expenseCardsHtml}
                    <div style="margin-top: 10px; background: linear-gradient(135deg, #fff7ed, #fef2f2); border: 1px solid #fecaca; padding: 16px; border-radius: 12px; text-align: center;">

                showModal(`
                    <div class="flex justify-between items-center mb-4 border-b border-slate-200/70 dark:border-white/10 pb-3">
                        <h3 class="font-extrabold text-lg text-slate-800 dark:text-white"><span class="text-cyan-600 dark:text-cyan-400">${m.name}</span> এর হিসাব</h3>
                        <button id="delMemberBtn" title="সদস্য ডিলিট করুন" class="text-rose-500 bg-rose-500/10 hover:bg-rose-500/20 p-2 rounded-xl transition-colors flex items-center gap-1 text-xs font-bold"><i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i> ডিলিট</button>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5 block">মোট জমা (৳) ও নতুন জমা / মাইনাস (-)</label>
                            <div class="grid grid-cols-2 gap-2.5">
                                <div>
                                    <span class="text-[10px] text-slate-400 block mb-1">বর্তমান মোট জমা</span>
                                    <input type="number" id="em-p-total" value="${baseP}" class="glass-input w-full p-3 text-sm rounded-2xl outline-none font-extrabold text-emerald-600 dark:text-emerald-400">
                                </div>
                                <div>
                                    <span class="text-[10px] text-cyan-600 dark:text-cyan-400 font-bold block mb-1">+ নতুন জমা (বা -মাইনাস)</span>
                                    <input type="number" id="em-p-new" placeholder="যেমন: 200 বা -200" class="glass-input w-full p-3 text-sm rounded-2xl outline-none font-bold">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5 flex items-center gap-1">
                                <i data-lucide="sticky-note" class="w-3.5 h-3.5 text-cyan-500"></i> জমার নোট (হিস্ট্রিতে লেখা থাকবে)
                            </label>
                            <input type="text" id="em-note" placeholder="যেমন: বিকাশে প্রদান / ক্যাশ জমা / বাজার সমন্বয়..." class="glass-input w-full p-3 text-sm rounded-2xl outline-none">
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5 block">নির্ধারিত মাসিক ফি (৳)</label>
                            <input type="number" id="em-fee" value="${m.custom_fee || ''}" placeholder="ডিফল্ট ৳${fmt(CONFIG.MONTHLY_FEE)}" class="glass-input w-full p-3 text-sm rounded-2xl outline-none font-bold">
                        </div>
                    </div>
                    <div class="flex gap-3 mt-6">
                        <button id="closeModal" class="flex-1 py-3 text-sm glass-card rounded-2xl font-bold">বাতিল</button>
                        <button id="saveMember" class="flex-1 py-3 text-sm bg-gradient-to-r from-cyan-600 to-indigo-600 text-white rounded-2xl font-bold transition-all active:scale-95 shadow-lg">আপডেট করুন</button>
                    </div>
                `, async () => {
                    const newPaid = Number(document.getElementById('em-p-total').value) || 0;
                    const oldPaid = Number(m.paid) || 0;
                    const noteVal = document.getElementById('em-note').value.trim();
                    const customFeeVal = document.getElementById('em-fee').value ? Number(document.getElementById('em-fee').value) : null;

                    const updated = {
                        paid: newPaid,
                        custom_fee: customFeeVal
                    };

                    await safeSupabaseUpdate('members', updated, m.id);
                    Object.assign(m, updated);
                    hideModal();
                    render();
                    showToast('সদস্যের হিসাব আপডেট হয়েছে!');

                    const noteSuffix = noteVal ? ` • নোট: ${noteVal}` : '';
                    if (newPaid !== oldPaid) {
                        const diffAmt = Math.abs(newPaid - oldPaid);
                        if (newPaid > oldPaid) {
                            await logActivity(
                                'টাকা জমা',
                                `${m.name} নতুন করে ৳${fmt(diffAmt)} জমা দিয়েছে। (মোট: ৳${fmt(newPaid)})${noteSuffix}`,
                                null,
                                { amount: diffAmt, member: m.name, member_id: m.id, note: noteVal, log_type: 'deposit' }
                            );
                        } else {
                            await logActivity(
                                'হিসাব মাইনাস',
                                `${m.name} এর জমা থেকে ৳${fmt(diffAmt)} মাইনাস করা হয়েছে। (মোট: ৳${fmt(newPaid)})${noteSuffix}`,
                                null,
                                { amount: diffAmt, member: m.name, member_id: m.id, note: noteVal, log_type: 'minus' }
                            );
                        }
                    } else if (noteVal) {
                        await logActivity('সদস্য নোট আপডেট', `${m.name} এর প্রোফাইলে নোট যুক্ত: ${noteVal}`, null, { member: m.name, member_id: m.id, note: noteVal });
                    }
                });

                document.getElementById('em-p-new')?.addEventListener('input', (ev) => {
                    const val = Number(ev.target.value) || 0;
                    document.getElementById('em-p-total').value = baseP + val;
                });

                document.getElementById('delMemberBtn')?.addEventListener('click', () => {
                    const memberPaid = Number(m.paid || 0);
                    showModal(`
                        <h3 class="font-extrabold text-rose-500 text-lg mb-2 text-center">সদস্য ডিলিট কনফার্মেশন</h3>
                        <p class="text-xs text-slate-600 dark:text-slate-300 mb-5 text-center leading-relaxed">
                            আপনি কি নিশ্চিত যে <b>${m.name}</b>-কে মেস থেকে সম্পূর্ণ ডিলিট করতে চান?<br>
                            তার জমাকৃত <b class="text-rose-500">৳${fmt(memberPaid)}</b> বাসার মোট ফান্ড ও ব্যালেন্স থেকে মাইনাস হয়ে যাবে এবং জমার হিস্ট্রিতে লাল অক্ষরে রেকর্ড থাকবে।
                        </p>
                        <div class="flex gap-3">
                            <button id="closeModal" class="flex-1 py-3 text-sm glass-card rounded-2xl font-bold">বাতিল</button>
                            <button id="confirmDelMember" class="flex-1 py-3 text-sm bg-rose-600 hover:bg-rose-700 text-white rounded-2xl font-bold shadow-lg shadow-rose-500/20 active:scale-95">ডিলিট করুন</button>
                        </div>
                    `, async () => {
                        if (supabase) await supabase.from('members').delete().eq('id', m.id);
                        data.members = data.members.filter(x => String(x.id) !== String(m.id));
                        data.cleaning.queue = data.cleaning.queue.filter(x => String(x.id) !== String(m.id));
                        if (supabase) await supabase.from('cleaning_tasks').update({ queue: data.cleaning.queue }).eq('id', '1');

                        hideModal();
                        await logActivity(
                            'সদস্য ডিলিট',
                            `${m.name}-কে ডিলিট করা হয়েছে এবং তার জমাকৃত ৳${fmt(memberPaid)} মাইনাস করা হয়েছে।`,
                            null,
                            { amount: memberPaid, member: m.name, member_id: m.id, log_type: 'member_deleted' }
                        );
                        render();
                        showToast(`${m.name}-কে ডিলিট করা হয়েছে এবং ৳${fmt(memberPaid)} ব্যালেন্স থেকে কমানো হয়েছে!`, 'error');
                    });
                });
            }));

            document.getElementById('addMemberBtn')?.addEventListener('click', () => {
                showModal(`
                    <h3 class="font-extrabold text-lg mb-4 border-b border-slate-200/70 dark:border-white/10 pb-3 text-slate-800 dark:text-white">নতুন সদস্য যোগ করুন</h3>
                    <div class="space-y-3.5">
                        <div>
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 block">সদস্যের নাম</label>
                            <input type="text" id="new-m-name" placeholder="নাম লিখুন" class="glass-input w-full p-3 text-sm rounded-2xl outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 block">নির্ধারিত ফি (৳) [ঐচ্ছিক]</label>
                            <input type="number" id="new-m-fee" placeholder="ডিফল্ট ৳${fmt(CONFIG.MONTHLY_FEE)}" class="glass-input w-full p-3 text-sm rounded-2xl outline-none">
                        </div>
                    </div>
                    <div class="flex gap-3 mt-6">
                        <button id="closeModal" class="flex-1 py-3 text-sm glass-card rounded-2xl font-bold">বাতিল</button>
                        <button id="saveNewMember" class="flex-1 py-3 text-sm bg-gradient-to-r from-cyan-600 to-indigo-600 text-white rounded-2xl font-bold active:scale-95 shadow-lg">যোগ করুন</button>
                    </div>
                `, async () => {
                    const name = document.getElementById('new-m-name').value.trim();
                    const customFee = document.getElementById('new-m-fee').value ? Number(document.getElementById('new-m-fee').value) : null;
                    if (!name) return showToast('সদস্যের নাম ফাঁকা রাখা যাবে না!', 'error');

                    const newId = generateUniqueId();
                    const newM = { id: newId, name, paid: 0, custom_fee: customFee };

                    await safeSupabaseInsert('members', newM);
                    data.members.push(newM);
                    if (data.cleaning && data.cleaning.queue) {
                        data.cleaning.queue.push({ id: newId, name, seq: 0 });
                        if (supabase) await supabase.from('cleaning_tasks').update({ queue: data.cleaning.queue }).eq('id', '1');
                    }

                    hideModal();
                    render();
                    showToast('নতুন সদস্য যুক্ত হয়েছে!');
                    await logActivity('নতুন সদস্য', `সিস্টেমে ${name}-কে নতুন সদস্য হিসেবে যুক্ত করা হয়েছে।`);
                });
            });
        };

        const showModal = (content, onSave) => {
            const mc = document.getElementById('modalContainer');
            mc.innerHTML = `<div class="glass-modal w-full max-w-md rounded-3xl p-6 fade-in relative my-auto text-slate-800 dark:text-slate-100">${content}</div>`;
            mc.classList.remove('hidden');
            document.getElementById('closeModal')?.addEventListener('click', hideModal);
            if (onSave) {
                const actionBtnIds = [
                    'saveRoutine', 'saveMember', 'checkPinBtn', 'confirmDelLog',
                    'confirmDelExp', 'confirmTaskReset', 'btnFinalReset',
                    'saveNewMember', 'confirmDelMember', 'confirmRestore',
                    'saveEditedExp', 'saveEditedLog'
                ];
                let attached = false;
                actionBtnIds.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) { btn.addEventListener('click', onSave); attached = true; }
                });
                if (!attached) {
                    const lastBtn = mc.querySelector('button:last-child');
                    if (lastBtn && lastBtn.id !== 'closeModal' && lastBtn.id !== 'delMemberBtn') lastBtn.addEventListener('click', onSave);
                }
            }
            lucide.createIcons();
        };

        const hideModal = () => document.getElementById('modalContainer').classList.add('hidden');

        document.getElementById('themeToggle').addEventListener('click', () => {
            isDark = !isDark;
            safeSetStorage('mess_theme', isDark ? 'dark' : 'light');
            applyTheme();
        });

        document.getElementById('adminBtn').addEventListener('click', () => {
            if (isAdmin) {
                isAdmin = false;
                safeRemoveStorage('mess_admin_pin');
                render();
                showToast('এডমিন থেকে লগআউট হয়েছে!');
                return;
            }
            showModal(`
                <div class="text-center mb-5">
                    <div class="w-16 h-16 bg-gradient-to-br from-cyan-500/20 to-indigo-500/20 text-cyan-600 dark:text-cyan-400 rounded-2xl flex items-center justify-center mx-auto mb-3 scale-in border border-cyan-500/30">
                        <i data-lucide="key-round" class="w-8 h-8"></i>
                    </div>
                    <h3 class="font-extrabold text-xl text-slate-800 dark:text-white">এডমিন পিন ভেরিফিকেশন</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">৬ ডিজিটের এডমিন পিন প্রবেশ করুন (ডিফল্ট: <b>123456</b>)</p>
                </div>
                <input type="password" id="adminPinInput" maxlength="6" inputmode="numeric" class="glass-input w-full p-4 rounded-2xl text-xl text-center tracking-[0.6em] font-mono font-extrabold outline-none" placeholder="••••••">
                <div class="flex gap-3 mt-6">
                    <button id="closeModal" class="flex-1 py-3 text-sm glass-card rounded-2xl font-bold">বাতিল</button>
                    <button id="checkPinBtn" class="flex-1 py-3 text-sm bg-gradient-to-r from-cyan-600 to-indigo-600 text-white rounded-2xl font-bold transition-all active:scale-95 shadow-lg">লগইন করুন</button>
                </div>
            `, () => {
                const inputPin = document.getElementById('adminPinInput').value.trim();
                if (inputPin === CONFIG.ADMIN_PIN) {
                    isAdmin = true;
                    safeSetStorage('mess_admin_pin', inputPin);
                    hideModal();
                    render();
                    showToast('এডমিন মোড চালু হয়েছে!');
                } else {
                    showToast('ভুল পিন! ৬ ডিজিটের সঠিক পিন দিন।', 'error');
                }
            });
            setTimeout(() => document.getElementById('adminPinInput')?.focus(), 100);
        });

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                activeTab = e.currentTarget.dataset.tab;
                safeSetStorage('mess_active_tab', activeTab);
                const appEl = document.getElementById('app-content');
                appEl.classList.remove('fade-in');
                void appEl.offsetWidth;
                appEl.classList.add('fade-in');
                render();
            });
        });

        let startY = 0;
        document.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchend', e => {
            const endY = e.changedTouches[0].clientY;
            if (window.scrollY === 0 && endY - startY > 150) {
                const loader = document.getElementById('ptr-loader');
                if (loader) loader.classList.add('active');
                setTimeout(() => location.reload(), 800);
            }
        }, { passive: true });

        initApp();
    </script>
</body>
</html>
